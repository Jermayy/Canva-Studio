# Packaging config. Renderer code is bundled by electron-vite, so only the
# main process's runtime dependencies (see package.json "dependencies")
# ship in node_modules.
appId: com.canvasstudio.desktop
productName: Canvas Studio
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  category: public.app-category.graphics-design
  hardenedRuntime: true
win:
  target: nsis
linux:
  target: AppImage
  category: Graphics
